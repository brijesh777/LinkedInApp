version: "3.8"

services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - linkedin-network


  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    volumes:
      - "kafka_data:/var/lib/kafka/data"
    networks:
      - linkedin-network

    # Standard Kafka Setting
    environment:
      #Kraft settings
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller, broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092, CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CONTROLLER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT, PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTNER_NAME=PLAINTEXT


  kafbat-ui:
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8090:8090"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb0:8080
    networks:
      - linkedin-network

  posts-db:
    image: postgres
    container_name: posts-db
    environment:
      - POSTGRES_DB=postDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - linkedin-network
    volumes:
      - post-db-data:/var/lib/postgresql/main

  user-db:
    image: postgres
    container_name: user-db
    environment:
      - POSTGRES_DB=userDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - linkedin-network
    volumes:
      - user-db-data:/var/lib/postgresql/main

  notification-db:
    image: postgres
    container_name: notification-db
    environment:
      - POSTGRES_DB=notificationDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - linkedin-network
    volumes:
      - notification-db-data:/var/lib/postgresql/main
  
  connections-db:
    image: neo4j
    container_name: connections-db
    environment:
      - NEO4J_AUTH=neo4j/password # username and password
    ports:
      - "7474:7474" # Http Port
      - "7687:7687" # Bolt Port
    volumes:
      - connections-db-data:/data
    networks:
      - linkedin-network

  
  
  discovery-server:
    image: briju777/linkedin-app/discovery-server
    container_name: discovery-server
    networks:
      - linkedin-network
    ports:
      - "8761:8761"


  notification-service:
    image: briju777/linkedin-app/notification-service
    container_name: notification-service
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - notification-db
      - kafka

  connections-service:
    image: briju777/linkedin-app/connections-service
    container_name: connections-service
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - connections-db
      - kafka


  api-gateway:
    image: briju777/linkedin-app/api-gateway
    container_name: api-gateway
    networks:
      - linkedin-network
    depends_on:
      - notification-db
    ports:
      - "8080:8080"

  posts-service:
    image: briju777/linkedin-app/posts-service
    container_name: posts-service
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - posts-db
      - kafka

  user-service:
    image: briju777/linkedin-app/user-service
    container_name: user-service
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - user-db
      - kafka


networks:
  linkedin-network:

volumes:
  kafka_data:
  notification-db-data:
  post-db-data:
  user-db-data:
  connections-db-data: