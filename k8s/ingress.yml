apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  labels:
    app.kubernetes.io/name: myingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "true"
spec:
  defaultBackend:
    service:
      name: api-gateway
      port:
        number: 80
  rules:
    - http:
        paths:
        - pathType: Prefix
          path: "/kafka-ui"
          backend:
            service:
              name: kafka-ui-service
              port:
                number: 8080
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: api-gateway
              port: 
                number: 80
